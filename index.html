<style>
/* Layout: one-screen app. Player = phone column; #host = projector board (path + crew list); #admin = question editor. Single deliberate deep-space look. */
:root{
  --void:#060918; --nebula:#10163A; --panel:#161E4A; --panel2:#1E2860; --line:#2E3A7A;

  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;

    var(--void)}
.sky::before,.sky::after{content:"";position:absolute;inset:0;background-repeat:repeat}
.sky::before{background-image:
  radial-gradient(1px 1px at 20px 30px,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 140px 90px,#cfd6ff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 80px 160px,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 190px 200px,#fff 50%,transparent 51%);
  background-size:220px 220px;opacity:.55}
.sky::after{background-image:
  radial-gradient(1.5px 1.5px at 60px 50px,#FFE3A3 50%,transparent 51%),
  radial-gradient(1px 1px at 260px 140px,#fff 50%,transparent 51%),
  radial-gradient(2px 2px at 330px 300px,#B9F4FF 50%,transparent 51%);
  background-size:380px 380px;opacity:.5;animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:.7}}
#app{position:relative;z-index:1;height:100%}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ion)}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.board{flex:1;min-height:0;width:100%}
.board svg{width:100%;height:100%;display:block}
.side{border-left:1px solid var(--line);background:rgba(16,22,58,.7);backdrop-filter:blur(6px);display:flex;flex-direction:column;min-height:0;
  padding-block:20px;padding-left:18px;padding-right:max(18px, env(safe-area-inset-right, 0px))}
.side h2{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.crew{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;flex:1}
.crew li{display:grid;grid-template-columns:28px 34px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;background:rgba(30,40,96,.5)}
.crew li .rk{font-family:var(--f-mono);font-weight:700;color:var(--dim);text-align:center}
.crew li:nth-child(1) .rk{color:var(--luce)}
.crew li .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.side .qr-mini{margin-top:14px;display:flex;gap:12px;align-items:center;font-size:13px;color:var(--dim)}
.side .qr-mini .qr{background:#fff;padding:6px;border-radius:10px;width:84px;height:84px;flex:none}
.qr img,.qr canvas{width:100%!important;height:100%!important;display:block}
.pl{transition:transform 1.1s cubic-bezier(.55,0,.2,1)}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,9,24,.72);z-index:5;text-align:center}
.overlay .big-count{font-size:220px}
.banner{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:4;background:linear-gradient(90deg,rgba(255,200,87,.95),rgba(255,226,150,.95));color:#1A1300;
  padding:12px 26px;border-radius:999px;font-family:var(--f-display);font-weight:700;font-size:24px;box-shadow:0 10px 50px -10px rgba(255,200,87,.8);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}

/* Lobby */
.lobby{height:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:48px;align-items:center;
  padding-block:32px;padding-left:max(48px, env(safe-area-inset-left, 0px));padding-right:max(48px, env(safe-area-inset-right, 0px))}
.lobby .qr-big{background:#fff;padding:18px;border-radius:24px;width:min(42vh,380px);aspect-ratio:1;max-width:100%;box-shadow:0 0 80px -10px rgba(110,231,249,.5)}
.lobby h1{font-size:clamp(40px,6vw,84px);line-height:.95}
.lobby h1 b{color:var(--luce)}
.lobby .url{font-family:var(--f-mono);font-size:14px;color:var(--dim);margin-top:14px;word-break:break-all}
.joined{display:flex;flex-wrap:wrap;gap:14px 10px;margin-top:22px;max-height:46vh;overflow:auto}
.joined .j{display:flex;flex-direction:column;align-items:center;width:86px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.joined .j svg{width:54px;height:auto;animation:float 4s ease-in-out infinite}
.joined .j span{font-size:13px;font-weight:700;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.count{font-family:var(--f-display);font-size:28px;margin-top:18px}
.count b{color:var(--ion)}

/* Podium */
.podium{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.podium h1{font-size:clamp(36px,5vw,64px)}
.steps{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;justify-content:center}

.step svg{width:90px;height:auto;animation:float 4s ease-in-out infinite}
.step .blk{width:100%;border-radius:16px 16px 0 0;background:linear-gradient(180deg,var(--panel2),var(--nebula));border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:42px;font-weight:700}
.step.p1 .blk{height:180px;color:var(--luce);border-color:rgba(255,200,87,.6)}
.step.p2 .blk{height:130px;color:var(--ion)}
.step.p3 .blk{height:96px;color:var(--dim)}
.step .nm{font-weight:800;font-size:20px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Admin */
.admin{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-block:28px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.admin h1{font-size:32px}
.qedit{display:flex;flex-direction:column;gap:10px}
.qedit .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:8px}
.opt input[type=radio]{accent-color:var(--ok);width:20px;height:20px;flex:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--ion);padding:10px 18px;border-radius:999px;z-index:20;font-weight:700}
@media (max-width:900px){
  .host{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;height:auto;min-height:100%}
  .host-main{padding-left:max(16px, env(safe-area-inset-left, 0px))}
  .board{min-height:60vw}
  .side{border-left:0;border-top:1px solid var(--line);max-height:none}
  .lobby{grid-template-columns:1fr;height:auto;gap:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .lobby .qr-big{width:min(80vw,320px)}
  .overlay .big-count{font-size:120px}

}
@media (max-width:560px){ .qedit .opts,.settings{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

<script>
// Link del QR: questa stessa pagina (GitHub Pages)
const JOIN_URL = location.origin + location.pathname;
const API = String(window.GAME_API || "").trim();
const DEFAULTS = { status: "lobby", round: 1, mainLen: 12, detourLen: 3, penaltySec: 3, startedAt: 0 };
const COLORS = ["#FFC857", "#6EE7F9", "#FF7AB6", "#9B8CFF", "#7CF29A", "#FF8A4C", "#4DA3FF", "#F25C54", "#E9EEFF", "#C6F35B"];
const NS = "http://www.w3.org/2000/svg";
const $app = document.getElementById("app");

let uid = null, isEditor = false, PIN = "", lastSave = 0;
let S = { ...DEFAULTS }, stateLoaded = false, Q = [], qLoaded = false;
let players = new Map(), playersLoaded = false;
let local = null;        // this viewer's player doc (authoritative locally)
let resetDoneRound = 0;
let screenKey = "";
let busy = false, phase = "q", lastPick = -1, lastOk = false, penaltyUntil = 0;
let draft = null;        // admin draft of questions
let joinColor = COLORS[Math.floor(Math.random() * COLORS.length)];
let connNote = "";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const route = () => (location.hash || "").replace("#", "") || "play";

function astro(color, cls = "") {
  return `<svg class="${cls}" viewBox="0 0 64 76" aria-hidden="true">
    <rect x="13" y="28" width="38" height="26" rx="9" fill="#AEB8E6"/>
    <rect x="6" y="34" width="14" height="9" rx="4.5" fill="#E6EAFF" transform="rotate(-18 13 38)"/>
    <rect x="44" y="34" width="14" height="9" rx="4.5" fill="#E6EAFF" transform="rotate(18 51 38)"/>
    <rect x="18" y="30" width="28" height="28" rx="11" fill="#F4F6FF"/>
    <rect x="18" y="41" width="28" height="5" fill="${color}"/>
    <rect x="22" y="54" width="9" height="15" rx="4" fill="#E6EAFF"/>
    <rect x="33" y="54" width="9" height="15" rx="4" fill="#E6EAFF"/>
    <rect x="21" y="65" width="11" height="6" rx="3" fill="#6B76B5"/>
    <rect x="32" y="65" width="11" height="6" rx="3" fill="#6B76B5"/>
    <line x1="44" y1="9" x2="48" y2="1" stroke="#E6EAFF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="48" cy="1.5" r="2.2" fill="${color}"/>
    <circle cx="32" cy="21" r="17" fill="#F4F6FF"/>
    <ellipse cx="33" cy="22" rx="12.5" ry="9.5" fill="${color}"/>
    <ellipse cx="33" cy="22" rx="12.5" ry="9.5" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1.2"/>
    <ellipse cx="28" cy="18.5" rx="4.5" ry="2.6" fill="#fff" opacity=".65"/>
  </svg>`;
}

// ---------- helpers ----------
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffled(n, seed) {
  const a = [...Array(n).keys()]; let s = seed || 1;
  for (let i = n - 1; i > 0; i--) { s = (Math.imul(s, 1103515245) + 12345) >>> 0; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function eff(p) { // effective position (players from an older round sit at the start)
  if (!p || p.round !== S.round) return { main: 0, detour: 0, finishedAt: null };
  return { main: Math.min(p.main || 0, S.mainLen), detour: p.detour || 0, finishedAt: p.finishedAt || null };
}
function remaining(p) { const e = eff(p); return (S.mainLen - e.main) + e.detour; }
function ranked() {
  return [...players.values()].sort((a, b) => {
    const ea = eff(a), eb = eff(b);
    if (ea.finishedAt && eb.finishedAt) return ea.finishedAt - eb.finishedAt;
    if (ea.finishedAt) return -1; if (eb.finishedAt) return 1;
    return remaining(a) - remaining(b) || (a.joinedAt || 0) - (b.joinedAt || 0);
  });
}
function countdownLeft() { return S.status === "playing" ? Math.ceil((S.startedAt - Date.now()) / 1000) : 0; }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
async function writeState(changes) {
  try { await api("state", { pin: PIN, state: { ...DEFAULTS, ...S, ...changes, updatedAt: Date.now() } }); }
  catch (e) { toast("Non riesco a salvare: controlla il PIN della regia."); }
}

// ---------- server (Google Apps Script) ----------
async function api(action, data) {
  const r = await fetch(API, { method: "POST", body: JSON.stringify({ action, ...data }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  applySnap(j); return j;
}
let pulling = false;
async function pull() {
  if (pulling) return; pulling = true;
  try { const r = await fetch(API + (API.includes("?") ? "&" : "?") + "t=" + Date.now()); applySnap(await r.json()); connNote = ""; }
  catch (e) { if (!stateLoaded) { connNote = "Non riesco a raggiungere la base. Controlla la rete: la pagina riprova da sola."; render(); } }
  finally { pulling = false; }
}
function applySnap(j) {
  if (!j || !j.state) return;
  S = { ...DEFAULTS, ...j.state }; stateLoaded = true;
  Q = (j.questions || []).filter(q => q && q.q && Array.isArray(q.a) && q.a.length >= 2); qLoaded = true;
  players = new Map((j.players || []).map(p => [p.id, p])); playersLoaded = true;
  if (uid && !local && players.has(uid)) local = { ...players.get(uid) };
  if (uid && local && !players.has(uid) && Date.now() - lastSave > 6000 && !busy) local = null; // rimosso dalla regia
  render();
}
function newId() { return "p" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

// ---------- boot ----------
async function boot() {
  if (!API) { connNote = "noapi"; render(); return; }
  try { uid = localStorage.getItem("ml_uid"); } catch {}
  if (!uid) { uid = newId(); try { localStorage.setItem("ml_uid", uid); } catch {} }
  try { PIN = localStorage.getItem("ml_pin") || ""; } catch {}
  render();
  await pull();
  await checkEditor();
  setInterval(() => pull(), route() === "play" ? 2500 : 1500);
  setInterval(tick, 250);
  try { await navigator.wakeLock?.request("screen"); } catch {}
}
async function checkEditor() {

      if (!el) {
        el = document.createElementNS(NS, "g"); el.setAttribute("class", "pl"); el.dataset.id = p.id;
        el.style.transform = `translate(${nodes[0].x - 24}px, ${nodes[0].y - 46}px)`;
        g.appendChild(el);
      }
      const sig = p.color + "|" + p.name + "|" + showName;
      if (el.dataset.sig !== sig) {
        el.dataset.sig = sig;
        el.innerHTML = `<g class="bob" style="animation-delay:${-(hash(p.id) % 3000)}ms"><svg width="48" height="57" viewBox="0 0 64 76">${astro(p.color).replace(/^<svg[^>]*>|<\/svg>\s*$/g, "")}</svg>
          ${showName ? `<text x="24" y="72" text-anchor="middle" fill="#EEF1FF" font-family="Manrope, sans-serif" font-weight="800" font-size="15" paint-order="stroke" stroke="#060918" stroke-width="4">${esc(p.name.slice(0, 12))}</text>` : ""}</g>`;
      }
      requestAnimationFrame(() => { el.style.transform = `translate(${x}px, ${y}px)`; });
    });
  }
  g.querySelectorAll(".pl").forEach(el => { if (!seen.has(el.dataset.id)) el.remove(); });
  // reset loop highlight for empty loops
  document.querySelectorAll('[id^="loop-"]').forEach(lc => {
    const m = +lc.id.slice(5);
    const busyLoop = [...groups.keys()].some(k => k[0] === "d" && +k.slice(1).split(":")[0] === m);
    lc.setAttribute("stroke-opacity", busyLoop ? ".9" : ".28");
  });
}
function renderCrew() {
  const r = ranked();
  const n = document.getElementById("ncrew"); if (n) n.textContent = r.length;
  const ol = document.getElementById("crew"); if (!ol) return;
  ol.innerHTML = r.map((p, i) => {
    const e = eff(p);
    const st = e.finishedAt ? `<span class="pill done">ARRIVATO</span>` : e.detour ? `<span class="pill detour">+${e.detour}</span>` : `<span class="pr">${e.main}/${S.mainLen}</span>`;
    return `<li><span class="rk">${i + 1}</span>${astro(p.color, "mini")}<span class="nm">${esc(p.name)}</span>${st}</li>`;
  }).join("") || `<li style="grid-template-columns:1fr"><span class="muted">Nessuno a bordo</span></li>`;
}

// ---------- ADMIN ----------
function renderAdmin() {
  if (!stateLoaded || !qLoaded) return setScreen("a-load", () => `<div class="admin"><h1>Carico le domande…</h1></div>`);
  if (!isEditor) return setScreen("a-no", () => `<div class="admin"><div class="eyebrow">Regia</div><h1>Solo la regia può modificare le domande</h1><p class="muted">Torna al <a href="#play" style="color:var(--ion)">gioco</a>.</p></div>`);
  if (!draft) draft = JSON.parse(JSON.stringify(Q.length ? Q : [{ q: "", a: ["", ""], c: 0 }]));
  setScreen("a-main", () => `<div class="admin">
      <div class="row between"><div><div class="eyebrow">Regia · Missione Luxia</div><h1>Domande e regole</h1></div>${editNav()}</div>
      <div class="card stack">
        <h3>Regole del percorso</h3>
        <div class="settings">
          <div class="stack" style="gap:6px"><label class="label" for="s-main">Caselle fino a Luxia</label><input type="number" id="s-main" min="4" max="30" value="${S.mainLen}"></div>
          <div class="stack" style="gap:6px"><label class="label" for="s-det">Caselle della deviazione</label><input type="number" id="s-det" min="1" max="6" value="${S.detourLen}"></div>
          <div class="stack" style="gap:6px"><label class="label" for="s-pen">Secondi di attesa dopo un errore</label><input type="number" id="s-pen" min="0" max="15" value="${S.penaltySec}"></div>
        </div>
        <p class="muted" style="margin:0">Ogni risposta giusta vale una casella. Una risposta sbagliata manda l'astronauta in deviazione: deve rispondere bene ad altre ${"<span id='detn'>" + S.detourLen + "</span>"} domande prima di tornare in rotta.</p>
        <div><button class="btn sm" id="s-save">Salva regole</button></div>
      </div>
      <div class="row between"><h3 id="qcount"></h3><div class="row"><button class="btn ghost sm" id="q-add">Aggiungi domanda</button><button class="btn sm" id="q-save">Salva domande</button></div></div>
      <div class="stack" id="qlist"></div>
      <details class="card"><summary style="cursor:pointer;font-weight:800">Importa o esporta in blocco (JSON)</summary>
        <div class="stack" style="margin-top:12px"><p class="muted" style="margin:0">Formato: una lista di oggetti con <span class="mono">q</span> (domanda), <span class="mono">a</span> (2 risposte) e <span class="mono">c</span> (indice della risposta giusta, 0 o 1).</p>
        <textarea id="json" rows="10" class="mono" style="font-size:13px"></textarea>
        <div class="row"><button class="btn ghost sm" id="j-exp">Mostra domande attuali</button><button class="btn sm" id="j-imp">Sostituisci con questo JSON</button></div></div></details>
    </div>`, () => {
      drawQList();
      document.getElementById("s-save").onclick = async () => {
        const v = (id, lo, hi, def) => Math.max(lo, Math.min(hi, parseInt(document.getElementById(id).value, 10) || def));
        await writeState({ mainLen: v("s-main", 4, 30, 12), detourLen: v("s-det", 1, 6, 3), penaltySec: v("s-pen", 0, 15, 3) });
        toast("Regole salvate");
      };
      document.getElementById("q-add").onclick = () => { syncDraft(); draft.push({ q: "", a: ["", ""], c: 0 }); drawQList(); };
      document.getElementById("q-save").onclick = saveQuestions;
      document.getElementById("j-exp").onclick = () => { syncDraft(); document.getElementById("json").value = JSON.stringify(draft, null, 2); };
      document.getElementById("j-imp").onclick = () => {
        try {
          const arr = JSON.parse(document.getElementById("json").value);
          if (!Array.isArray(arr)) throw 0;
          draft = arr.map(x => ({ q: String(x.q || ""), a: [0, 1].map(i => String((x.a || [])[i] || "")), c: Math.max(0, Math.min(1, +x.c || 0)) }));
          drawQList(); toast(`${draft.length} domande pronte: premi Salva domande`);
        } catch { toast("JSON non valido: controlla virgole e parentesi"); }
      };
    });
}
function drawQList() {
  const el = document.getElementById("qlist");
  document.getElementById("qcount").textContent = `${draft.length} domande`;
  el.innerHTML = draft.map((q, n) => `<div class="card qedit" data-n="${n}">
      <div class="row between"><span class="eyebrow">Domanda ${n + 1}</span><button class="btn danger sm" data-del="${n}">Elimina</button></div>
      <textarea id="q-${n}-t" rows="2" placeholder="Testo della domanda">${esc(q.q)}</textarea>
      <div class="opts">${[0, 1].map(i => `<label class="opt"><input type="radio" name="c-${n}" id="q-${n}-c${i}" value="${i}" ${q.c === i ? "checked" : ""} aria-label="Risposta giusta ${i + 1}">
        <input type="text" id="q-${n}-a${i}" value="${esc(q.a[i] || "")}" placeholder="Risposta ${"ABCD"[i]}"></label>`).join("")}</div>
      <span class="label">Seleziona il pallino accanto alla risposta giusta.</span>
    </div>`).join("");
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { syncDraft(); draft.splice(+b.dataset.del, 1); drawQList(); });
}
function syncDraft() {
  draft = draft.map((q, n) => {
    const t = document.getElementById(`q-${n}-t`); if (!t) return q;
    const a = [0, 1].map(i => document.getElementById(`q-${n}-a${i}`).value.trim());
    const ci = [0, 1].find(i => document.getElementById(`q-${n}-c${i}`).checked) ?? 0;
    return { q: t.value.trim(), a, c: ci };
  });
}
async function saveQuestions() {
  syncDraft();
  const clean = draft.map(q => {
    const a = q.a.filter(x => x); const right = q.a[q.c];
    return { q: q.q, a, c: Math.max(0, a.indexOf(right)) };
  }).filter(q => q.q && q.a.length >= 2);
  try { await api("questions", { pin: PIN, list: clean }); toast(`${clean.length} domande salvate`); draft = JSON.parse(JSON.stringify(clean)); drawQList(); }
  catch { toast("Non riesco a salvare: serve il permesso da editor."); }
}

boot();
</script>
